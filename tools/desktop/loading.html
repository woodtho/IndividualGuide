<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Individual Guide</title>
<style>
body{font:16px system-ui,sans-serif;background:#171a27;color:#eef0fa;margin:0;display:grid;place-items:center;height:100vh}
main{max-width:36rem;padding:3rem}h1{font-size:1.8rem;font-weight:600}p{color:#b6bed4;line-height:1.6}
.spinner{border:3px solid #363c52;border-top-color:#85aaff;border-radius:50%;width:26px;height:26px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<body data-desktop-loading="true"><main><div class="spinner" role="status" aria-label="Starting"></div><h1>Individual Guide</h1><p id="desktop-status" role="status">Starting your workspace...</p></main></body>
</html>
